<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meeting Action Extractor</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 40px 20px;
      background: #f4f6fb;
      color: #202438;
      font-family: Arial, sans-serif;
    }

    .container {
      width: min(900px, 100%);
      margin: 0 auto;
    }

    header {
      margin-bottom: 28px;
    }

    header h1 {
      margin: 0 0 8px;
      font-size: clamp(1.8rem, 4vw, 2.5rem);
    }

    header p {
      margin: 0;
      color: #62697c;
      line-height: 1.6;
    }

    .card {
      margin-bottom: 20px;
      padding: 24px;
      border: 1px solid #e4e7ef;
      border-radius: 16px;
      background: white;
      box-shadow: 0 8px 24px rgb(28 39 70 / 6%);
    }

    label {
      display: block;
      margin-bottom: 10px;
      font-weight: 700;
    }

    textarea {
      display: block;
      width: 100%;
      min-height: 230px;
      padding: 14px;
      resize: vertical;
      border: 1px solid #d8dce8;
      border-radius: 10px;
      color: #202438;
      font: inherit;
      line-height: 1.6;
    }

    textarea:focus {
      border-color: #5368e8;
      outline: 3px solid rgb(83 104 232 / 15%);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }

    button {
      padding: 11px 16px;
      border: 0;
      border-radius: 9px;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
    }

    .primary {
      background: #5368e8;
      color: white;
    }

    .primary:hover {
      background: #4055d2;
    }

    .secondary {
      background: #eef0f7;
      color: #33394c;
    }

    .secondary:hover {
      background: #e2e5ef;
    }

    .hint {
      margin: 12px 0 0;
      color: #73798a;
      font-size: 0.9rem;
      line-height: 1.5;
    }

    .results-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    .results-header h2 {
      margin: 0;
      font-size: 1.25rem;
    }

    #status {
      color: #73798a;
      font-size: 0.9rem;
    }

    .result {
      display: grid;
      grid-template-columns: 1fr 1.6fr 1fr;
      gap: 16px;
      padding: 16px 0;
      border-top: 1px solid #edf0f5;
    }

    .result div {
      min-width: 0;
    }

    .result small {
      display: block;
      margin-bottom: 5px;
      color: #7a8090;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .empty {
      padding: 20px 0 4px;
      color: #73798a;
      line-height: 1.5;
    }

    @media (max-width: 620px) {
      body {
        padding: 24px 14px;
      }

      .card {
        padding: 18px;
      }

      .result {
        grid-template-columns: 1fr;
        gap: 10px;
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <header>
      <h1>Meeting Action Extractor</h1>
      <p>Paste meeting notes to find action items, owners, and deadlines.</p>
    </header>

    <section class="card">
      <label for="notes">Meeting notes</label>
      <textarea id="notes" placeholder="Example:
Alex: I’ll prepare the initial wireframes by Wednesday.
Jordan: Send the project brief by Friday."></textarea>

      <div class="actions">
        <button class="primary" id="extractButton">Extract action items</button>
        <button class="secondary" id="sampleButton">Load sample</button>
        <button class="secondary" id="clearButton">Clear</button>
      </div>

      <p class="hint">
        This browser-only version looks for lines like “Name: task by deadline.”
        It does not send your notes to a server.
      </p>
    </section>

    <section class="card" aria-live="polite">
      <div class="results-header">
        <h2>Action items</h2>
        <span id="status">No results yet</span>
      </div>
      <div id="results" class="empty">Your extracted action items will appear here.</div>
    </section>
  </main>

  <script>
    const sampleNotes = `Website revamp kickoff
Alex: What are the main features you want on the new landing page?
Client: We need a modern hero section, customer testimonials, and an integrated booking calendar.
Alex: Would you prefer Calendly integration or a custom-built solution?
Client: Calendly works fine and keeps it simple.
Alex: Perfect, I'll prepare the initial wireframes by Wednesday.`;

    const notesInput = document.getElementById("notes");
    const results = document.getElementById("results");
    const status = document.getElementById("status");

    function extractActions(notes) {
      const actions = [];
      const pattern = /^([^:\n]+):\s*(.+?)\s+by\s+([^\n.]+)[.]?$/i;

      for (const line of notes.split(/\r?\n/)) {
        const match = line.trim().match(pattern);

        if (match) {
          actions.push({
            owner: match[1].trim(),
            task: match[2].trim(),
            deadline: match[3].trim()
          });
        }
      }

      return actions;
    }

    function renderActions(actions) {
      results.replaceChildren();

      if (actions.length === 0) {
        results.className = "empty";
        results.textContent =
          "No action items found. Try a line like “Alex: Send the draft by Friday.”";
        status.textContent = "0 found";
        return;
      }

      results.className = "";
      status.textContent = `${actions.length} found`;

      for (const action of actions) {
        const row = document.createElement("article");
        row.className = "result";

        for (const [label, value] of [
          ["Owner", action.owner],
          ["Task", action.task],
          ["Deadline", action.deadline]
        ]) {
          const cell = document.createElement("div");
          const heading = document.createElement("small");
          const text = document.createElement("span");

          heading.textContent = label;
          text.textContent = value;
          cell.append(heading, text);
          row.appendChild(cell);
        }

        results.appendChild(row);
      }
    }

    document.getElementById("extractButton").addEventListener("click", () => {
      renderActions(extractActions(notesInput.value));
    });

    document.getElementById("sampleButton").addEventListener("click", () => {
      notesInput.value = sampleNotes;
      renderActions(extractActions(sampleNotes));
    });

    document.getElementById("clearButton").addEventListener("click", () => {
      notesInput.value = "";
      results.className = "empty";
      results.textContent = "Your extracted action items will appear here.";
      status.textContent = "No results yet";
    });
  </script>
</body>
</html>
